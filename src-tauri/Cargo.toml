[package]
name = "fathom"
version = "0.1.0"
description = "A depth board for Firstmate tasks"
edition = "2024"

[lib]
name = "fathom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
portable-pty = "0.9.0"
notify = "8.2.2"
csv = "1.4.0"
libc = "0.2.191"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFString"] }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std", "CTFontManager"] }
